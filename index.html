<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Will You Be My Valentine? 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Quicksand', sans-serif; }
body {
  height:100vh; display:flex; justify-content:center; align-items:center;
  background: linear-gradient(145deg, #ffd1dc, #ff9acb, #ffc6e0);
  overflow:hidden; text-align:center; color:#fff; position:relative;
}
h1 { font-family: 'Dancing Script', cursive; font-size:3.5rem; margin-bottom:1rem; text-shadow: 2px 2px 6px rgba(0,0,0,0.3);}
p { font-size:1.3rem; margin-bottom:2rem;}
.btn {
  padding:15px 35px; font-size:1.3rem; border:none; border-radius:50px; cursor:pointer; margin:10px;
  background-color:#fff; color:#ff4d6d; font-weight:600; position:relative; box-shadow:0 4px 8px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
}
#yesBtn:hover { animation: bounce 0.6s; box-shadow:0 0 20px #fff;}
@keyframes bounce {0%{transform:translateY(0);}30%{transform:translateY(-12px);}50%{transform:translateY(0);}70%{transform:translateY(-6px);}100%{transform:translateY(0);}}
.btn:hover { background-color:#ffe0e6; color:#ff2a55; transform:scale(1.15); }

#message { margin-top:30px; font-size:1.6rem; display:none; animation: fadeIn 1.5s forwards; line-height:1.6; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.heart, .sparkle, .confetti, .trail, .star, .clickHeart { position:absolute; border-radius:50%; opacity:0.8; }

.heart { width:20px; height:20px; background-color:#fff; transform:rotate(45deg); animation: float 6s infinite; }
.heart::before, .heart::after { content:""; position:absolute; width:20px; height:20px; background-color:#fff; border-radius:50%; }
.heart::before { top:-10px; left:0; } .heart::after { left:10px; top:0; }
@keyframes float {0%{transform:translateY(0) rotate(45deg);opacity:0.7;}50%{opacity:1;}100%{transform:translateY(-800px) rotate(45deg);opacity:0;} }

.sparkle { width:5px; height:5px; background-color:#fff; animation: sparkle 3s infinite; }
@keyframes sparkle {0%{transform:scale(0.5);}50%{transform:scale(1.5);}100%{transform:scale(0.5);} }

.trail { width:15px; height:15px; background-color:#ff4d6d; transform:rotate(45deg); pointer-events:none; }
.trail::before, .trail::after { content:""; position:absolute; width:15px; height:15px; background-color:#ff4d6d; border-radius:50%; }
.trail::before { top:-7px; left:0; } .trail::after { left:7px; top:0; }

.star { width:5px; height:5px; background-color:#fff; border-radius:50%; pointer-events:none; animation: sparkleStar 0.8s linear forwards; }
@keyframes sparkleStar {0%{opacity:1; transform:scale(0.5);}50%{transform:scale(1.5);}100%{opacity:0; transform:scale(0);} }

.clickHeart { width:15px; height:15px; background-color:#ff4d6d; transform:rotate(45deg); pointer-events:none; animation: riseHeart 1s forwards; }
.clickHeart::before, .clickHeart::after { content:""; position:absolute; width:15px; height:15px; background-color:#ff4d6d; border-radius:50%; }
.clickHeart::before { top:-7px; left:0; } .clickHeart::after { left:7px; top:0; }
@keyframes riseHeart { 0% { opacity:1; transform: translateY(0) scale(1); } 100% { opacity:0; transform: translateY(-150px) scale(1.5); } }
</style>
</head>
<body>

<div>
<h1>💖 Will You Be My Valentine? 💖</h1>
<p>I made this little heart just for you 💕</p>
<button class="btn" id="yesBtn">Yes 💌</button>
<button class="btn" id="noBtn">No 😅</button>
<div id="message">
  You’re amazing and I’m so lucky to have you! 🥰💖<br>
  You made me the happiest woman alive! ✨💘
</div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

// Show message + confetti + floating hearts on Yes click
yesBtn.addEventListener('click', () => {
  const msg = document.getElementById('message');
  msg.style.display = 'block';

  // Confetti
  for(let i=0;i<50;i++){
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.width=confetti.style.height=(5+Math.random()*15)+'px';
    confetti.style.backgroundColor=['#ff4d6d','#ffb3c6','#ffe0e6','#fff'][Math.floor(Math.random()*4)];
    confetti.style.left=(window.innerWidth/2)+(Math.random()*200-100)+'px';
    confetti.style.top=(window.innerHeight/2)+(Math.random()*200-100)+'px';
    confetti.style.transition='all 1.5s ease-out';
    document.body.appendChild(confetti);
    setTimeout(()=>{ confetti.style.top=Math.random()*window.innerHeight+'px'; confetti.style.left=Math.random()*window.innerWidth+'px'; confetti.style.opacity=0; },50);
    setTimeout(()=>{ confetti.remove(); },2000);
  }

  // Floating click hearts from button
  for(let i=0;i<20;i++){
    const heart = document.createElement('div');
    heart.classList.add('clickHeart');
    heart.style.left = yesBtn.offsetLeft + yesBtn.offsetWidth/2 + (Math.random()*60-30) + 'px';
    heart.style.top = yesBtn.offsetTop + (Math.random()*20-10) + 'px';
    document.body.appendChild(heart);
    setTimeout(()=>{ heart.remove(); },1000);
  }
});

// Dodge No button
noBtn.addEventListener('mouseenter', () => {
  const x = Math.random()*(window.innerWidth-noBtn.offsetWidth-50);
  const y = Math.random()*(window.innerHeight-noBtn.offsetHeight-50);
  noBtn.style.position='absolute';
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
});

// Floating hearts
const heartColors=['#fff','#ffe0e6','#ffb3c6','#ff8aa6'];
for(let i=0;i<50;i++){
  const heart=document.createElement('div');
  heart.classList.add('heart');
  heart.style.left=Math.random()*window.innerWidth+'px';
  heart.style.animationDuration=(4+Math.random()*4)+'s';
  heart.style.backgroundColor=heartColors[Math.floor(Math.random()*heartColors.length)];
  heart.style.width=heart.style.height=(10+Math.random()*25)+'px';
  document.body.appendChild(heart);
}

// Sparkles
for(let i=0;i<50;i++){
  const sparkle=document.createElement('div');
  sparkle.classList.add('sparkle');
  sparkle.style.left=Math.random()*window.innerWidth+'px';
  sparkle.style.top=Math.random()*window.innerHeight+'px';
  sparkle.style.animationDuration=(2+Math.random()*2)+'s';
  document.body.appendChild(sparkle);
}

// Heart trail following cursor
document.addEventListener('mousemove', e=>{
  const trail = document.createElement('div');
  trail.classList.add('trail');
  trail.style.left = e.pageX - 7 + 'px';
  trail.style.top = e.pageY - 7 + 'px';
  document.body.appendChild(trail);
  setTimeout(()=>{ trail.remove(); }, 800);
});

// Yes button sparkle stars
yesBtn.addEventListener('mousemove', e=>{
  const star = document.createElement('div');
  star.classList.add('star');
  star.style.left = e.pageX + (Math.random()*20-10) + 'px';
  star.style.top = e.pageY + (Math.random()*20-10) + 'px';
  document.body.appendChild(star);
  setTimeout(()=>{ star.remove(); }, 800);
});
</script>
</body>
</html>
